<!DOCTYPE html>
<html lang="en" style="background-color: black;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product landing page</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="icon" type="image/x-icon" href="/images/anthony2.png">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif ;
      background: black;
      color: white;
      min-height: 100vh;
      margin: 0;
      padding-top: 110px;
    }

    h4 {
      font-weight: normal;
      font-size: 30px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .mac {
      margin-top: 0 auto;
      width: 700px; 
      display: block;
      justify-content: center;
      align-items: center;
      height : auto;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    p {
      text-align: center;
    }

    .dsc-prg p {
      margin: 0 0 5px;
    }

    @media (max-width: 768px) {
      body {
        padding-top: 100px;
      }

      h4 {
        font-size: 24px;
        text-align: center;
      }

      .mac {
        width: min(90vw, 500px);
      }

      .dsc-prg {
        width: 100%;
        padding: 0 20px;
      }

      .dsc-prg p {
        font-size: 14px;
        line-height: 1.6;
      }

      .btn-portfolio {
        width: 100%;
        max-width: 180px;
      }
    }

    /* 1. Define the animation keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px); /* Starts 30px lower */
      }
      to {
        opacity: 1;
        transform: translateY(0); /* Moves up to its original position */

      }
    }



  </style>
</head>
<body>
  
  <header>
    <nav class="nav-bar">
      <img src="/images/anthony2.png" alt="logo">
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/portfolio.html">Portfolio</a></li>
        </ul>
    </nav>
    <h4>MacBook Pro</h4>
  </header>

  <main>
    <div>
      <img src="/images/mac.png" alt="mockup image of the macbook pro 16" class="mac">
    </div>

    <div class="dsc-prg">
      <p>A 16-inch MackBook Pro</p>
      <p>High-Performance | Wide display | Sleek Design
      </p>
      <p>
        Built for Professionals who need an immersive display and powerful hardware that runs cool and lasts all day.
      </p>
    </div>

    <div>
      <a href=""><button class="btn-portfolio">Buy Now</button></a>
    </div>
      
  </main>

</body>
</html>
