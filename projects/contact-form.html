<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="icon" type="image/x-icon" href="/images/anthony2.png">
</head>
<body>

  <header>
    <nav class="nav-bar">
      <img src="/images/anthony2.png" alt="logo">
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/portfolio.html">Portfolio</a></li>
        </ul>
    </nav>
  </header>

  <main>

    <div class="form-container">
      <h1 class="contact-form">Contact Form</h1>

    <form id="contact-form" class="form">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message:</label>
    <textarea name="message" id="message" required></textarea>

    <button type="submit" class="btn-portfolio" style="display: flex; justify-content: center; align-items: center; margin: 10px auto;">Send</button>

    </form>
    </div>

    <p style="margin-top: 15px; text-align: center;">It works, send us a message! ;)</p>
    
<script>
  const form = document.getElementById("contact-form");
  const submitButton = form.querySelector("button[type='submit']");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Disable button immediately
    submitButton.disabled = true;
    submitButton.textContent = "Sending...";

    const data = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      message: document.getElementById("message").value
    };

    try {
      await fetch(
        "https://script.google.com/macros/s/AKfycbydfSEHnmyVcit1cxoVNZMGSy8OPJpfjZcRHfleXVnPinKko3zMwl2RHrArB4m2Z06Y/exec",
        {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(data)
        }
      );

      alert("Message sent successfully!");
      form.reset();

      submitButton.textContent = "Sent!";

    } catch (error) {
      console.error("Error:", error);

      alert("Something went wrong. Please try again.");

      // Re-enable if something went wrong
      submitButton.disabled = false;
      submitButton.textContent = "Send";
    }
  });
</script>
  </main>
  
</body>
</html>
